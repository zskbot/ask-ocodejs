name: Hosted runner diagnostic

on:
  push:
    branches:
      - diagnose/ask-ocodejs-hosted-runner

permissions:
  contents: read

concurrency:
  group: ask-ocodejs-runner-diagnostic
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Confirm hosted runner allocation
        run: |
          echo "Hosted runner allocated successfully"
          uname -a
          node --version || true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
